# ─────────────────────────────────────────────────────────────────────────────
# Nginx Reverse Proxy Config for HRMS
# File: /etc/nginx/sites-available/hrms
#
# HOW TO USE:
#   1. Copy to /etc/nginx/sites-available/hrms
#   2. ln -s /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   3. Replace "hrms.yourdomain.com" with your actual domain
#   4. Obtain SSL certificate: certbot --nginx -d hrms.yourdomain.com
#   5. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate-limiting zone (shared memory, 10MB) ──────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hrms.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.yourdomain.com;

    # ── SSL Certificates (managed by Certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/hrms.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.yourdomain.com/privkey.pem;

    # ── TLS Hardening ──────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security Headers ───────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none';"
        always;

    # Remove version fingerprinting
    server_tokens off;

    # ── File upload limit (match backend 2MB body limit) ──────────────────────
    client_max_body_size 10M;

    # ── Frontend static files ──────────────────────────────────────────────────
    root /var/www/hrms/frontend;
    index login.html;

    location / {
        try_files $uri $uri/ /login.html;
    }

    # ── API Reverse Proxy → Node.js on port 5000 ──────────────────────────────
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Login endpoint — stricter rate limiting ────────────────────────────────
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Uploaded files served directly by Nginx ───────────────────────────────
    # (Remove this block if uploads should require auth — serve via Node instead)
    location /uploads/ {
        alias      /var/www/hrms/backend/uploads/;
        expires    7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(css|js|woff|woff2|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Block hidden files / dev artifacts ────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Access and error logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/hrms_access.log;
    error_log  /var/log/nginx/hrms_error.log  warn;
}
